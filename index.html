<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F0E8" />
    <meta
            name="description"
            content="Craftad connects homeowners and businesses with vetted local artisans—backed by transparent bidding and secure escrow payments."
    />
    <title>Craftad — Hire Vetted Local Artisans</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent dark-mode white flash before React mounts -->
    <script>
        (function () {
            const saved = localStorage.getItem("craftad_theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isDark = saved === "dark" || (!saved && prefersDark);
            if (isDark) {
                document.documentElement.classList.add("dark");
                document
                    .querySelector('meta[name="theme-color"]')
                    ?.setAttribute("content", "#14110F");
            }
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    />

    <!-- Defer Paystack so it never blocks initial page paint -->
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
